<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 Controllo Bot Telegram RSS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .status-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            border-left: 5px solid #28a745;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }

        .status-online {
            background-color: #28a745;
        }

        .status-offline {
            background-color: #dc3545;
        }

        .status-unknown {
            background-color: #ffc107;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .controls {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            min-width: 150px;
            position: relative;
            overflow: hidden;
        }

        .btn:before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .btn:hover:before {
            left: 100%;
        }

        .btn-start {
            background: linear-gradient(45deg, #28a745, #20c997);
            color: white;
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.3);
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(40, 167, 69, 0.4);
        }

        .btn-stop {
            background: linear-gradient(45deg, #dc3545, #e74c3c);
            color: white;
            box-shadow: 0 5px 15px rgba(220, 53, 69, 0.3);
        }

        .btn-stop:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(220, 53, 69, 0.4);
        }

        .btn-status {
            background: linear-gradient(45deg, #007bff, #0056b3);
            color: white;
            box-shadow: 0 5px 15px rgba(0, 123, 255, 0.3);
        }

        .btn-status:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 123, 255, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .loading {
            display: none;
            margin: 20px 0;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .message {
            margin: 20px 0;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }

        .message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.info {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            color: #666;
            font-size: 0.9em;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
                margin: 20px;
            }
            
            .controls {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 100%;
                max-width: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Bot Control Panel</h1>
            <p>Gestisci il tuo Bot Telegram RSS da remoto</p>
        </div>

        <div class="status-card">
            <h3>📊 Stato Bot</h3>
            <p id="bot-status">
                <span class="status-indicator status-unknown"></span>
                <span id="status-text">Verifica in corso...</span>
            </p>
            <p id="last-update" style="font-size: 0.9em; color: #666; margin-top: 10px;">
                Ultimo aggiornamento: --
            </p>
        </div>

        <div class="controls">
            <button class="btn btn-start" onclick="startBot()">
                🚀 Avvia Bot
            </button>
            <button class="btn btn-stop" onclick="stopBot()">
                🛑 Ferma Bot
            </button>
            <button class="btn btn-status" onclick="checkStatus()">
                🔄 Aggiorna Stato
            </button>
        </div>

        <div class="loading">
            <div class="spinner"></div>
            <p>Operazione in corso...</p>
        </div>

        <div id="message" class="message"></div>

        <div class="footer">
            <p>🔒 Connessione sicura via SSH</p>
            <p>Sviluppato per il controllo remoto del Bot RSS</p>
        </div>
    </div>

    <script>
        // Configurazione
        const API_BASE = '/api';
        
        // Elementi DOM
        const statusIndicator = document.querySelector('.status-indicator');
        const statusText = document.getElementById('status-text');
        const lastUpdate = document.getElementById('last-update');
        const loading = document.querySelector('.loading');
        const message = document.getElementById('message');
        const buttons = document.querySelectorAll('.btn');

        // Funzioni di utilità
        function showLoading() {
            loading.style.display = 'block';
            buttons.forEach(btn => btn.disabled = true);
        }

        function hideLoading() {
            loading.style.display = 'none';
            buttons.forEach(btn => btn.disabled = false);
        }

        function showMessage(text, type = 'info') {
            message.textContent = text;
            message.className = `message ${type}`;
            message.style.display = 'block';
            setTimeout(() => {
                message.style.display = 'none';
            }, 5000);
        }

        function updateStatus(status, text) {
            statusIndicator.className = `status-indicator status-${status}`;
            statusText.textContent = text;
            lastUpdate.textContent = `Ultimo aggiornamento: ${new Date().toLocaleString('it-IT')}`;
        }

        // Funzioni API
        async function makeRequest(endpoint, method = 'GET') {
            try {
                const response = await fetch(`${API_BASE}${endpoint}`, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Errore nella richiesta');
                }
                
                return data;
            } catch (error) {
                console.error('Errore API:', error);
                throw error;
            }
        }

        // Funzioni di controllo bot
        async function startBot() {
            showLoading();
            try {
                const result = await makeRequest('/start', 'POST');
                showMessage(result.message || 'Bot avviato con successo!', 'success');
                setTimeout(checkStatus, 2000); // Verifica stato dopo 2 secondi
            } catch (error) {
                showMessage(`Errore nell'avvio del bot: ${error.message}`, 'error');
            } finally {
                hideLoading();
            }
        }

        async function stopBot() {
            showLoading();
            try {
                const result = await makeRequest('/stop', 'POST');
                showMessage(result.message || 'Bot fermato con successo!', 'success');
                setTimeout(checkStatus, 2000); // Verifica stato dopo 2 secondi
            } catch (error) {
                showMessage(`Errore nel fermare il bot: ${error.message}`, 'error');
            } finally {
                hideLoading();
            }
        }

        async function checkStatus() {
            showLoading();
            try {
                const result = await makeRequest('/status');
                
                if (result.running) {
                    updateStatus('online', `🟢 Bot Online - PID: ${result.pid || 'N/A'}`);
                } else {
                    updateStatus('offline', '🔴 Bot Offline');
                }
                
                if (result.details) {
                    showMessage(`Dettagli: ${result.details}`, 'info');
                }
            } catch (error) {
                updateStatus('unknown', '⚠️ Stato Sconosciuto');
                showMessage(`Errore nel verificare lo stato: ${error.message}`, 'error');
            } finally {
                hideLoading();
            }
        }

        // Inizializzazione
        document.addEventListener('DOMContentLoaded', function() {
            checkStatus(); // Verifica stato iniziale
            
            // Aggiornamento automatico ogni 30 secondi
            setInterval(checkStatus, 30000);
        });

        // Gestione errori globali
        window.addEventListener('error', function(e) {
            console.error('Errore JavaScript:', e.error);
            showMessage('Si è verificato un errore imprevisto', 'error');
        });
    </script>
</body>
</html>
