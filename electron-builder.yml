appId: com.runtimeradio.titandesktop
productName: Runtime Telegram Bot Titan Edition
directories:
  buildResources: build
  output: Builds
files:
  - dist-electron/**/*
  - dist/**/*
  - resources/**/*
  - package.json
  # Escludi TUTTO node_modules tranne better-sqlite3, l'unico modulo nativo.
  # Tutte le altre dipendenze JS (telegraf, rss-parser, youtubei.js, react, ecc.)
  # sono già bundlate inline da Vite.
  #
  # better-sqlite3 13 è un modulo N-API con i binari precompilati dentro il
  # pacchetto (prebuilds/<piattaforma>-<arch>.node): l'ABI è stabile tra versioni
  # di Node ed Electron, quindi non si ricompila nulla e non servono più
  # `bindings` né `file-uri-to-path`. Sorgenti C (deps/, src/) e binari delle
  # piattaforme che non distribuiamo restano fuori: sono 10 MB di zavorra.
  - "!node_modules/**/*"
  - node_modules/better-sqlite3/package.json
  - node_modules/better-sqlite3/LICENSE
  - node_modules/better-sqlite3/lib/**/*
  - node_modules/better-sqlite3/prebuilds/win32-x64.node
  - node_modules/better-sqlite3/prebuilds/linux-x64.node
  - node_modules/better-sqlite3/prebuilds/linux-arm64.node
asarUnpack:
  - resources/**
  # I moduli nativi (.node) non possono essere caricati dall'interno di un archivio asar
  - node_modules/better-sqlite3/prebuilds/**/*

# Niente ricompilazione dei moduli nativi per l'ABI di Electron: l'unico modulo
# nativo è N-API e porta già i suoi binari (vedi sopra).
npmRebuild: false

fileAssociations:
  - ext: rtb
    name: Titan Bot Profile
    description: Runtime Telegram Bot Configuration File
    role: Editor
    icon: build/icon.ico

# === Windows ===
win:
  executableName: TitanDesktop
  icon: resources/icon.png
  target:
    - nsis
    - portable
nsis:
  artifactName: RuntimeTelegramBot-TitanEdition-Setup-${version}.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: true
# Eseguibile unico, senza installazione. Non si auto-aggiorna: electron-builder
# non scrive le informazioni di aggiornamento per il target portable, quindi la
# versione portable non compare in latest.yml e va riscaricata a mano.
portable:
  artifactName: RuntimeTelegramBot-TitanEdition-Portable-${version}.${ext}

# macOS non è supportato: il target è stato rimosso nel luglio 2026.
# Le piattaforme di distribuzione sono Windows e Linux.

# === Linux ===
# L'architettura non è dichiarata qui: la sceglie la riga di comando
# (`--x64` / `--arm64`), perché ogni architettura si compila sul proprio runner.
# ${arch} nel nome è obbligatorio, altrimenti x64 e arm64 producono file omonimi
# che si sovrascrivono a vicenda quando la release li raccoglie insieme.
linux:
  maintainer: Simone Pizzi (Runtime Utilities) <info@runtimeradio.it>
  icon: resources/icon.png
  target:
    - AppImage
    - deb
    - rpm
    - pacman
    - tar.gz
  category: Utility
  artifactName: RuntimeTelegramBot-TitanEdition-${version}-${arch}.${ext}

# === Auto-Update (release sulla repo pubblica del progetto) ===
publish:
  provider: github
  owner: Pitz72
  repo: Runtime-TelegramBot-Desktop-Titan-Edition
  private: false
