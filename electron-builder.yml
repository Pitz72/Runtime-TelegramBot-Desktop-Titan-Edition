appId: com.runtimeradio.titandesktop
productName: Runtime Telegram Bot Titan Edition
directories:
  buildResources: build
  output: Builds
files:
  - dist-electron/**/*
  - dist/**/*
  - resources/**/*
  - package.json
  # Escludi TUTTO node_modules tranne le dipendenze native di better-sqlite3.
  # Tutte le altre dipendenze JS (telegraf, rss-parser, youtubei.js, react, ecc.)
  # sono già bundlate inline da Vite grazie a ssr.noExternal: true.
  - "!node_modules/**/*"
  - node_modules/better-sqlite3/**/*
  - node_modules/bindings/**/*
  - node_modules/file-uri-to-path/**/*
asarUnpack:
  - resources/**
  # I moduli nativi (.node) non possono essere caricati dall'interno di un archivio asar
  - node_modules/better-sqlite3/build/**/*

fileAssociations:
  - ext: rtb
    name: Titan Bot Profile
    description: Runtime Telegram Bot Configuration File
    role: Editor
    icon: build/icon.ico

# === Windows ===
win:
  executableName: TitanDesktop
  icon: resources/icon.png
  target: nsis
nsis:
  artifactName: RuntimeTelegramBot-TitanEdition-Setup-${version}.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: true

# macOS non è supportato: il target è stato rimosso nel luglio 2026.
# Le piattaforme di distribuzione sono Windows e Linux.

# === Linux ===
linux:
  maintainer: Runtime Radio <info@runtimeradio.it>
  icon: resources/icon.png
  target:
    - AppImage
    - deb
  category: Utility
  artifactName: RuntimeTelegramBot-TitanEdition-${version}.${ext}

# === Auto-Update (release sulla repo pubblica del progetto) ===
publish:
  provider: github
  owner: Pitz72
  repo: Runtime-TelegramBot-Desktop-Titan-Edition
  private: false
