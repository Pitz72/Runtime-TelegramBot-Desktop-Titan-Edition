name: Build — Mac & Linux

# Si attiva quando viene creato un tag tipo "v1.7.7"
# oppure manualmente dalla tab Actions su GitHub
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ─── macOS ────────────────────────────────────────────────────────────────
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build macOS DMG
        # CSC_IDENTITY_AUTO_DISCOVERY=false salta la firma del codice (nessun certificato Apple)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx tsc && npx vite build && npx electron-builder --mac --publish never

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: Builds/*.dmg
          if-no-files-found: error

  # ─── Linux ────────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Linux (AppImage + deb)
        run: npx tsc && npx vite build && npx electron-builder --linux --publish never

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: Builds/*.AppImage
          if-no-files-found: error

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: Builds/*.deb
          if-no-files-found: error

  # ─── GitHub Release ───────────────────────────────────────────────────────
  # Crea la release solo se il workflow è stato triggerato da un tag
  release:
    needs: [build-mac, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            mac-dmg/*.dmg
            linux-appimage/*.AppImage
            linux-deb/*.deb
