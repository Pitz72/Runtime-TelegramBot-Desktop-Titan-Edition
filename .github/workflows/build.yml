name: Build & Release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish release to bridge repo after build'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
  pull_request:
    branches: [main]

# NOTA: Node 20 e non oltre. better-sqlite3 non ha prebuild per Node 22/24:
# node-gyp fallisce e sul runner Windows Visual Studio non viene rilevato.
# Il warning "Node 20 deprecato" nelle Actions riguarda il runtime delle action
# (checkout/setup-node/cache), lo gestisce GitHub e NON si risolve cambiando node-version.

jobs:
  # Verifica dei contributi: gira su ogni pull request verso main.
  # Non produce installer, controlla solo che il progetto compili pulito.
  verify:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Build bundles
        run: npx vite build
      - name: Check locale key parity
        run: node scripts/check-locales.mjs

  build-linux:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-linux-${{ hashFiles('package-lock.json') }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev libfuse2
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npx tsc && npx vite build && npx electron-builder --linux --publish never
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            Builds/*.AppImage
            Builds/*.deb
            Builds/latest-linux.yml
          retention-days: 30

  build-windows:
    runs-on: windows-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-win-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npx tsc && npx vite build && npx electron-builder --windows --publish never
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            Builds/*.exe
            Builds/latest.yml
          retention-days: 30

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.publish_release == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version from package.json
        id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: artifacts/linux

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: artifacts/windows

      - name: Publish release to bridge repo
        uses: softprops/action-gh-release@v2
        with:
          repository: Ecosystem-Runtime/runtime-telegrambot-releases
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Titan Edition ${{ steps.version.outputs.tag }}"
          body: |
            ## Runtime TelegramBot — Titan Edition ${{ steps.version.outputs.tag }}

            Download the installer for your platform:

            | Platform | File |
            |----------|------|
            | **Windows** | `*.exe` |
            | **Linux (AppImage)** | `*.AppImage` |
            | **Linux (deb)** | `*.deb` |

            > Supported platforms: Windows and Linux.
            > The app updates automatically — existing users will be notified in-app.
          files: |
            artifacts/linux/*.AppImage
            artifacts/linux/*.deb
            artifacts/linux/latest-linux.yml
            artifacts/windows/*.exe
            artifacts/windows/latest.yml
