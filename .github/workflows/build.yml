name: Build & Release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish release to bridge repo after build'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

jobs:
  # Windows: build locale, non fa parte del CI per ora
  # Mac: in sospeso — in attesa di firma dal collega

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-linux-${{ hashFiles('package-lock.json') }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev libfuse2
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            Builds/*.AppImage
            Builds/*.deb
            Builds/latest-linux.yml
          retention-days: 30

  release:
    needs: [build-linux]
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.publish_release == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version from package.json
        id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'linux-artifacts'
          merge-multiple: false

      - name: Publish release to bridge repo
        uses: softprops/action-gh-release@v2
        with:
          repository: Ecosystem-Runtime/runtime-telegrambot-releases
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Titan Edition ${{ steps.version.outputs.tag }}"
          body: |
            ## Runtime TelegramBot — Titan Edition ${{ steps.version.outputs.tag }}

            Download the installer for your platform:

            | Platform | File |
            |----------|------|
            | **Linux (AppImage)** | `*.AppImage` |
            | **Linux (deb)** | `*.deb` |

            > Windows and macOS builds coming soon.
            > The app updates automatically — existing users will be notified in-app.
          files: |
            linux-artifacts/*.AppImage
            linux-artifacts/*.deb
            linux-artifacts/latest-linux.yml
